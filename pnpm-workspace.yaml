packages:
  # 包含 apps 目录下的所有子项目，即农屿产品
  - "apps/*"
  # 包含 packages 目录下的所有子项目，即农屿工具库
  - "packages/*"

allowBuilds:
  better-sqlite3: true
  dtrace-provider: false
  esbuild: true
  react-native-update: true
  sharp: true

# 项目统一依赖版本管理，不区分开发时依赖和运行时依赖，也不区分是否是全局依赖
catalog:
  typescript: "^5.7.0" #
  tsup: "^8.0.0" #
  oxfmt: "^0.62.0" #
  oxlint: "^0.10.0" #
  vite: "^8.0.0" #
  husky: "^9.1.7" #
  lint-staged: "^17.3.0" #
  "@commitlint/cli": "^21.2.1" #
  "@commitlint/config-conventional": "^21.2.0" #
  axios: "^1.17.0" #
  iconv-lite: "^0.7.2" #
  buffer: "^6.0.3" #
  # 统一身份认证响应体为 AES-128-CBC 加密；RN 无 node:crypto，用纯 JS 实现
  crypto-js: "^4.2.0" #
  "@types/crypto-js": "^4.2.2" #
  mitt: "^3.0.1" #
  react: "^19.2.0" #
  "@types/react": "^19.2.0" #
  "@types/react-dom": "^19.2.0" #
  react-dom: "^19.2.0" #
  react-native: "^0.85.2" #
  react-markdown: "^10.1.0" #
  remark-gfm: "^4.0.0" #
  remend: "^1.3.1" #
  rehype-highlight: "^7.0.0" #
  rehype-sanitize: "^6.0.0" #
  highlight.js: "^11.11.1" #
  "@vitejs/plugin-react": "^4.3.4" #
  autoprefixer: "^10.4.20" #
  postcss: "^8.5.1" #
  tailwindcss: "^3.4.17" #
  react-grid-layout: "^1.5.2" #
  react-resizable: "^3.0.5" #
  "@types/react-grid-layout": "^1.3.5" #
  sqlite3-parser: "^0.7.1" #
